name: Selenium Java CI

permissions:
  contents: read
  packages: write

on:
  push:

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Selenium CI
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # =====================================================
      # 2. Java / Maven setup
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version


      # =====================================================
      # 3. Smoke
      # =====================================================

      - name: Run Smoke suite on GitHub runner
        run: |
          mvn clean test -P Smoke -Dbrowser=chrome -Dheadless=true


      # =====================================================
      # 4. Login to GHCR
      # =====================================================

      - name: Login to GitHub Container Registry
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =====================================================
      # 5. PR ONLY - Build SHA image
      # =====================================================

      - name: Build Docker image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} \
            .

      - name: Push Docker image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}


      # =====================================================
      # 6. MAIN ONLY - Build SHA + main image
      # =====================================================

      - name: Build Docker image for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:main \
            .

      - name: Push Docker image for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:main


      # =====================================================
      # 7. PR ONLY - Install / Login OpenShift
      # =====================================================

      - name: Install OpenShift CLI
        if: github.event_name == 'pull_request'
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      - name: Login to OpenShift
        if: github.event_name == 'pull_request'
        run: |
          oc login "${{ vars.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}"

          oc project "${{ vars.OPENSHIFT_NAMESPACE }}"


      # =====================================================
      # 8. Create Regression Job with PVC
      # =====================================================

      - name: Create Regression Job in OpenShift
        id: create-regression
        if: github.event_name == 'pull_request'
        run: |
          cat <<'EOF' | oc apply -f -
          apiVersion: batch/v1
          kind: Job

          metadata:
            name: selenium-regression-${{ github.run_id }}

          spec:
            backoffLimit: 0

            template:
              spec:
                restartPolicy: Never

                containers:
                  - name: selenium-regression

                    image: ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

                    command:
                      - /bin/sh
                      - -c

                    args:
                      - |
                        echo "Starting Selenium Regression"

                        RUN_ID="${{ github.run_id }}"
                        RESULT_DIR="/test-results/${RUN_ID}"

                        mkdir -p "${RESULT_DIR}/extent"
                        mkdir -p "${RESULT_DIR}/surefire"
                        mkdir -p "${RESULT_DIR}/screenshots"

                        mvn clean test -P Regression -Dbrowser=chrome -Dheadless=true

                        RESULT=$?

                        echo "Regression Maven exit code: ${RESULT}"
                        echo "Saving reports to PVC..."

                        if [ -d "/app/reports" ]; then
                          cp -r /app/reports/. "${RESULT_DIR}/extent/" || true
                        fi

                        if [ -d "/app/target/surefire-reports" ]; then
                          cp -r /app/target/surefire-reports/. "${RESULT_DIR}/surefire/" || true
                        fi

                        if [ -d "/app/src/main/resources/screenShots" ]; then
                          cp -r /app/src/main/resources/screenShots/. "${RESULT_DIR}/screenshots/" || true
                        fi

                        echo "${RESULT}" > "${RESULT_DIR}/test-exit-code.txt"

                        echo "Regression artifacts saved to:"
                        echo "${RESULT_DIR}"

                        exit "${RESULT}"

                    volumeMounts:
                      - name: selenium-results-storage
                        mountPath: /test-results

                volumes:
                  - name: selenium-results-storage
                    persistentVolumeClaim:
                      claimName: selenium-results-pvc

          EOF


      # =====================================================
      # 9. Wait for Regression result
      # =====================================================

      - name: Wait for OpenShift Regression Job
        id: regression-result
        if: github.event_name == 'pull_request'
        run: |
          JOB_NAME=selenium-regression-${{ github.run_id }}

          for i in {1..180}; do

            if oc get job $JOB_NAME \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' \
              | grep -q True; then

              echo "Regression Job completed successfully."
              exit 0
            fi

            if oc get job $JOB_NAME \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' \
              | grep -q True; then

              echo "Regression Job failed."
              exit 1
            fi

            echo "Regression Job is still running..."
            sleep 5

          done

          echo "Regression Job timed out after 15 minutes."
          exit 1


      # =====================================================
      # 10. Show Regression logs
      # =====================================================

      - name: Show OpenShift Regression logs
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        run: |
          oc logs job/selenium-regression-${{ github.run_id }} || true


      # =====================================================
      # 11. Create temporary reader Pod
      # =====================================================

      - name: Create PVC Reader Pod
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        run: |
          cat <<'EOF' | oc apply -f -
          apiVersion: v1
          kind: Pod

          metadata:
            name: selenium-results-reader-${{ github.run_id }}

          spec:
            restartPolicy: Never

            containers:
              - name: reader

                image: ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

                command:
                  - /bin/sh
                  - -c

                args:
                  - |
                    echo "Results reader pod started"
                    sleep 3600

                volumeMounts:
                  - name: selenium-results-storage
                    mountPath: /test-results

            volumes:
              - name: selenium-results-storage
                persistentVolumeClaim:
                  claimName: selenium-results-pvc

          EOF

          oc wait \
            --for=condition=Ready \
            pod/selenium-results-reader-${{ github.run_id }} \
            --timeout=120s


      # =====================================================
      # 12. Verify data exists in PVC
      # =====================================================

      - name: Show Regression results stored in PVC
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        run: |
          echo "Files stored in OpenShift persistent volume:"

          oc exec selenium-results-reader-${{ github.run_id }} \
            -- find /test-results/${{ github.run_id }} \
            -maxdepth 3 \
            -type f \
            || true


      # =====================================================
      # 13. Copy Regression artifacts FROM PVC
      # =====================================================

      - name: Copy Regression artifacts from PVC
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        run: |
          mkdir -p regression-artifacts

          oc cp \
            selenium-results-reader-${{ github.run_id }}:/test-results/${{ github.run_id }}/. \
            regression-artifacts/ \
            || true


      # =====================================================
      # 14. Upload Regression artifacts to GitHub
      # =====================================================

      - name: Upload Regression Extent report
        id: upload-regression-extent
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: regression-extent-report
          path: regression-artifacts/extent
          if-no-files-found: warn

      - name: Upload Regression Surefire reports
        id: upload-regression-surefire
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: regression-surefire-reports
          path: regression-artifacts/surefire
          if-no-files-found: warn

      - name: Upload Regression failure screenshots
        id: upload-regression-screenshots
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-screenshots
          path: regression-artifacts/screenshots
          if-no-files-found: ignore


      # =====================================================
      # 15. Send Regression email
      # =====================================================

      - name: Send Regression result email
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        continue-on-error: true

        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ vars.REPORT_EMAIL_TO }}

          REGRESSION_OUTCOME: ${{ steps.regression-result.outcome }}

          EXTENT_ARTIFACT_URL: ${{ steps.upload-regression-extent.outputs.artifact-url }}
          SCREENSHOT_ARTIFACT_URL: ${{ steps.upload-regression-screenshots.outputs.artifact-url }}
          SUREFIRE_ARTIFACT_URL: ${{ steps.upload-regression-surefire.outputs.artifact-url }}

          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}

          BRANCH_NAME: ${{ github.head_ref }}
          COMMIT_SHA: ${{ github.sha }}

          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}

        run: |
          python <<'PY'
          import os
          import smtplib

          from email.message import EmailMessage
          from pathlib import Path


          outcome = os.environ.get("REGRESSION_OUTCOME", "failure")

          if outcome == "success":
              status = "PASSED"
              status_icon = "✅"
              status_color = "#2e7d32"
          else:
              status = "FAILED"
              status_icon = "❌"
              status_color = "#c62828"


          run_number = os.environ["RUN_NUMBER"]
          run_id = os.environ["RUN_ID"]

          branch = os.environ.get("BRANCH_NAME", "")
          commit = os.environ["COMMIT_SHA"][:7]

          repository = os.environ["REPOSITORY"]
          server_url = os.environ["SERVER_URL"]

          extent_url = os.environ.get("EXTENT_ARTIFACT_URL", "")
          screenshot_url = os.environ.get("SCREENSHOT_ARTIFACT_URL", "")
          surefire_url = os.environ.get("SUREFIRE_ARTIFACT_URL", "")

          run_url = (
              f"{server_url}/"
              f"{repository}/actions/runs/"
              f"{run_id}"
          )


          msg = EmailMessage()

          msg["Subject"] = (
              f"{status_icon} Selenium Regression {status} "
              f"- Run #{run_number}"
          )

          msg["From"] = os.environ["EMAIL_USERNAME"]
          msg["To"] = os.environ["REPORT_EMAIL_TO"]


          text_body = f"""
          Selenium Automation Regression Result

          Status     : {status}
          Repository : {repository}
          Branch     : {branch}
          Commit     : {commit}
          Run        : #{run_number}

          GitHub Actions Run:
          {run_url}

          Extent Report:
          {extent_url}

          Failure Screenshots:
          {screenshot_url}

          Surefire Reports:
          {surefire_url}

          This notification was generated automatically by GitHub Actions.
          """

          msg.set_content(text_body)


          html_body = f"""
          <html>
            <body style="font-family: Arial, sans-serif;">

              <h2>Selenium Automation Regression Result</h2>

              <p>
                <strong>Status:</strong>
                <span style="color:{status_color}; font-size:18px;">
                  {status_icon} {status}
                </span>
              </p>

              <table cellpadding="6" cellspacing="0" border="0">
                <tr>
                  <td><strong>Repository</strong></td>
                  <td>{repository}</td>
                </tr>

                <tr>
                  <td><strong>Branch</strong></td>
                  <td>{branch}</td>
                </tr>

                <tr>
                  <td><strong>Commit</strong></td>
                  <td>{commit}</td>
                </tr>

                <tr>
                  <td><strong>Run</strong></td>
                  <td>#{run_number}</td>
                </tr>
              </table>

              <br>

              <p>
                <a href="{run_url}">
                  View GitHub Actions Run
                </a>
              </p>

              <p>
                <a href="{extent_url}">
                  Download Regression Extent Report
                </a>
              </p>

              <p>
                <a href="{screenshot_url}">
                  Download Failure Screenshots
                </a>
              </p>

              <p>
                <a href="{surefire_url}">
                  Download Surefire Reports
                </a>
              </p>

              <hr>

              <p style="font-size:12px;color:#666;">
                Generated automatically by GitHub Actions.
              </p>

            </body>
          </html>
          """

          msg.add_alternative(
              html_body,
              subtype="html"
          )


          report = Path(
              "regression-artifacts/extent/index.html"
          )


          if report.exists():

              print(
                  f"Attaching Extent report: {report}"
              )

              with report.open("rb") as file:

                  msg.add_attachment(
                      file.read(),
                      maintype="text",
                      subtype="html",
                      filename="Regression-Extent-Report.html"
                  )

          else:

              print(
                  "Extent report not found. "
                  "Email will be sent without attachment."
              )


          print(
              f"Sending Regression result email to "
              f"{os.environ['REPORT_EMAIL_TO']}"
          )


          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465
          ) as smtp:

              smtp.login(
                  os.environ["EMAIL_USERNAME"],
                  os.environ["EMAIL_APP_PASSWORD"]
              )

              smtp.send_message(msg)


          print(
              "Regression result email sent successfully."
          )

          PY


      # =====================================================
      # 16. Delete temporary PVC reader Pod
      # =====================================================

      - name: Delete PVC Reader Pod
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          steps.create-regression.outcome == 'success'
        run: |
          oc delete pod \
            selenium-results-reader-${{ github.run_id }} \
            --ignore-not-found=true


      # =====================================================
      # 17. Upload Smoke artifacts
      # =====================================================

      - name: Upload Smoke Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Smoke Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-extent-report
          path: reports
          if-no-files-found: warn

      - name: Upload Smoke failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-screenshots
          path: src/main/resources/screenShots
          if-no-files-found: ignore