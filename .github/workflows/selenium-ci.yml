# =====================================================
# 8. Collect OpenShift Regression artifacts
# =====================================================

- name: Get Regression Pod name
  if: always() && github.event_name == 'pull_request'
  id: regression-pod
  run: |
    POD_NAME=$(oc get pods \
      -l job-name=selenium-regression-${{ github.run_id }} \
      -o jsonpath='{.items[0].metadata.name}')
    
    echo "pod_name=$POD_NAME" >> $GITHUB_OUTPUT
    echo "Regression Pod: $POD_NAME"

- name: Copy Regression Extent report
  if: always() && github.event_name == 'pull_request'
  run: |
    mkdir -p regression-artifacts/extent-report
    
    oc cp \
      ${{ steps.regression-pod.outputs.pod_name }}:/app/reports/. \
      regression-artifacts/extent-report/ \
      || true

- name: Copy Regression Surefire reports
  if: always() && github.event_name == 'pull_request'
  run: |
    mkdir -p regression-artifacts/surefire-reports
    
    oc cp \
      ${{ steps.regression-pod.outputs.pod_name }}:/app/target/surefire-reports/. \
      regression-artifacts/surefire-reports/ \
      || true

- name: Copy Regression failure screenshots
  if: always() && github.event_name == 'pull_request'
  run: |
    mkdir -p regression-artifacts/screenshots
    
    oc cp \
      ${{ steps.regression-pod.outputs.pod_name }}:/app/src/main/resources/screenShots/. \
      regression-artifacts/screenshots/ \
      || true

# =====================================================
# 9. Upload Regression artifacts to GitHub
# =====================================================

- name: Upload Regression Extent report
  if: always() && github.event_name == 'pull_request'
  uses: actions/upload-artifact@v4
  with:
    name: regression-extent-report
    path: regression-artifacts/extent-report
    if-no-files-found: warn

- name: Upload Regression Surefire reports
  if: always() && github.event_name == 'pull_request'
  uses: actions/upload-artifact@v4
  with:
    name: regression-surefire-reports
    path: regression-artifacts/surefire-reports
    if-no-files-found: warn

- name: Upload Regression failure screenshots
  if: always() && github.event_name == 'pull_request'
  uses: actions/upload-artifact@v4
  with:
    name: regression-failure-screenshots
    path: regression-artifacts/screenshots
    if-no-files-found: ignore

# =====================================================
# 10. GitHub Smoke artifacts
# =====================================================

- name: Upload Smoke Surefire reports
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: smoke-surefire-reports
    path: target/surefire-reports
    if-no-files-found: warn

- name: Upload Smoke Extent report
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: smoke-extent-report
    path: reports
    if-no-files-found: warn

- name: Upload Smoke failure screenshots
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: smoke-failure-screenshots
    path: src/main/resources/screenShots
    if-no-files-found: ignore