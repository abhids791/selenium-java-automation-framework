name: Selenium Java CI

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: Smoke
        type: choice
        options:
          - Smoke
          - Regression

jobs:
  test:
    name: Run ${{ github.event.inputs.suite || 'Smoke' }} tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run TestNG suite
        run: mvn clean test -P ${{ github.event.inputs.suite || 'Smoke' }} -Dbrowser=chrome -Dheadless=true

      # -------------------------------
      # Docker / GitHub Container Registry
      # -------------------------------

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} .

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

      # -------------------------------
      # Test artifacts
      # -------------------------------

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: src/main/resources/screenShots
          if-no-files-found: ignore