name: Selenium Java CI

permissions:
  contents: read
  packages: write

on:
  # Push to any branch
  push:

  # PR targeting main
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Selenium CI
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout code
        uses: actions/checkout@v4

      # =====================================================
      # 2. Java / Maven setup
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      # =====================================================
      # 3. Smoke - runs on every Push / PR / Manual execution
      # =====================================================

      - name: Run Smoke suite on GitHub runner
        run: |
          mvn clean test -P Smoke -Dbrowser=chrome -Dheadless=true

      # =====================================================
      # 4. Login to GHCR
      #
      # Runs when:
      #   - PR targets main
      #   - Code is pushed/merged into main
      # =====================================================

      - name: Login to GitHub Container Registry
        if: >
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # 5. PR ONLY - Build SHA image
      # =====================================================

      - name: Build Docker image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} \
            .

      - name: Push Docker image for PR
        if: github.event_name == 'pull_request'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

      # =====================================================
      # 6. MAIN ONLY - Build SHA + main image
      # =====================================================

      - name: Build Docker image for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/selenium-java-tests:main \
            .

      - name: Push Docker image for main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }}

          docker push \
            ghcr.io/${{ github.repository_owner }}/selenium-java-tests:main

      # =====================================================
      # 7. PR ONLY - OpenShift Regression
      # =====================================================

      - name: Install OpenShift CLI
        if: github.event_name == 'pull_request'
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar -xzf openshift-client-linux.tar.gz
          sudo mv oc /usr/local/bin/oc
          oc version --client

      - name: Login to OpenShift
        if: github.event_name == 'pull_request'
        run: |
          oc login "${{ vars.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}"

          oc project "${{ vars.OPENSHIFT_NAMESPACE }}"

      - name: Create Regression Job in OpenShift
        if: github.event_name == 'pull_request'
        run: |
          JOB_NAME=selenium-regression-${{ github.run_id }}

          oc create job $JOB_NAME \
            --image=ghcr.io/${{ github.repository_owner }}/selenium-java-tests:${{ github.sha }} \
            -- mvn clean test -P Regression -Dbrowser=chrome -Dheadless=true

          oc patch job $JOB_NAME \
            --type=merge \
            -p '{"spec":{"backoffLimit":0}}'

      - name: Wait for OpenShift Regression Job
        if: github.event_name == 'pull_request'
        run: |
          oc wait \
            --for=condition=complete \
            job/selenium-regression-${{ github.run_id }} \
            --timeout=15m

      - name: Show OpenShift Regression logs
        if: always() && github.event_name == 'pull_request'
        run: |
          oc logs job/selenium-regression-${{ github.run_id }} || true

      # =====================================================
      # 8. GitHub Smoke artifacts
      # =====================================================

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-extent-report
          path: reports
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-screenshots
          path: src/main/resources/screenShots
          if-no-files-found: ignore