name: Selenium Java CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: Smoke
        type: choice
        options:
          - Smoke
          - Regression

jobs:
  test:
    name: Run ${{ github.event.inputs.suite || 'Smoke' }} tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run TestNG suite
        run: mvn clean test -P ${{ github.event.inputs.suite || 'Smoke' }} -Dbrowser=chrome -Dheadless=true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: warn

      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: src/main/resources/screenShots
          if-no-files-found: ignore
